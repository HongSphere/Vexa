<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vexa</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("vexa_settings_v2");
          var mode = raw ? JSON.parse(raw).themeMode || "system" : "system";
          var isDark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add("dark");
            root.classList.remove("theme-light");
          } else {
            root.classList.add("theme-light");
            root.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="vx-app antialiased selection:bg-sky-500/30 selection:text-sky-200 overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
